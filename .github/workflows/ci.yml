name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: firefox/ in sync with chrome/, versions agree
        run: node tools/build.mjs --check

      - name: Unit tests
        run: npm test

      - name: Lint the Firefox build (addons.mozilla.org rules)
        run: npx -y web-ext@8 lint --source-dir firefox --warnings-as-errors

      - name: Build packages
        run: node tools/build.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/*.zip
          retention-days: 14
