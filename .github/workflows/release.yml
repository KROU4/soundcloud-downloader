name: Release

# Push a tag like v1.2.0 (it must match the version in both manifests and package.json).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Verify sources and version
        run: node tools/build.mjs --check --version "$GITHUB_REF_NAME"

      - name: Unit tests
        run: npm test

      - name: Lint the Firefox build
        run: npx -y web-ext@8.10.0 lint --source-dir firefox --warnings-as-errors

      - name: Build packages
        run: node tools/build.mjs

      # Optional: a signed .xpi installs permanently in any Firefox. Needs the repository
      # secrets AMO_JWT_ISSUER and AMO_JWT_SECRET (addons.mozilla.org → Developer Hub → API keys).
      - name: Sign for Firefox (unlisted)
        if: env.AMO_JWT_ISSUER != '' && env.AMO_JWT_SECRET != ''
        run: |
          npx -y web-ext@8.10.0 sign --source-dir firefox --channel unlisted \
            --api-key "$AMO_JWT_ISSUER" --api-secret "$AMO_JWT_SECRET" \
            --artifacts-dir dist/signed
          for f in dist/signed/*.xpi; do mv "$f" "dist/soundcloud-downloader-firefox-${GITHUB_REF_NAME#v}.xpi"; done

      - name: Release notes from CHANGELOG.md
        run: node tools/changelog.mjs "$GITHUB_REF_NAME" > dist/notes.md

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.xpi \
            --title "SoundCloud Downloader ${GITHUB_REF_NAME#v}" --notes-file dist/notes.md
